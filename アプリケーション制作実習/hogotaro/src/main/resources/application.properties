spring.application.name=hogotaro

#jspの置き場所
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

#DB関連
#DB接続
spring.datasource.url=jdbc:mysql://localhost:3306/hogotaro?serverTimezone=Asia/Tokyo&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

# ---- テーブルは sql/schema.sql で作る。Hibernate に作らせない
#      土台が動いたら一度だけ validate にして起動し、Entity と DDL のズレを潰してから none に戻す
spring.jpa.hibernate.ddl-auto=none

# 学習用: 発行される SQL をコンソールに出す（うるさければ false）
spring.jpa.show-sql=true

# ---- エラー: Spring Boot 標準の白いページを止め、403 / 404 / 413 / 500 を jsp/error.jsp で出す
#      Spring Boot 4 で名前が変わった。3 系の server.error.whitelabel.enabled は 4 では効かない（廃止）
spring.web.error.whitelabel.enabled=false

# ---- 写真: プロジェクト直下の uploads/ を静的ファイルとして公開する（uploads/photos/a.jpg -> /photos/a.jpg）
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
